allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  prisma: set this to true or false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - unrs-resolver

# 关闭运行脚本前的依赖检查，避免 pnpm dev 被 install 阻塞
verifyDepsBeforeRun: false
